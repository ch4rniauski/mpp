<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Credits API UI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Credits</h1>

<button onclick="loadCredits()">Load Credits</button>

<div id="credits"></div>

<hr>

<h2>Add Credit</h2>

<input id="name" placeholder="Name"><br>
<input id="amount" placeholder="Amount" type="number"><br>
<input id="rate" placeholder="Interest Rate" type="number" step="0.01"><br>
<input id="date" placeholder="Issue Date" type="date"><br>
<input id="term" placeholder="Term (months)" type="number"><br>

<button onclick="addCredit()">Add</button>

<script src="app.js"></script>
</body>
</html>
